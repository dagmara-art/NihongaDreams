<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found — Dagmara Dreams of Nihonga">
    <meta name="robots" content="noindex">
    <title>Page not found — Dagmara Dreams of Nihonga</title>
    <link rel="icon" type="image/png" href="Data/sakura_favicon.png?v=2">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a227;
            --cream: #faf8f5;
            --charcoal: #2a2a2a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            color: var(--charcoal);
            background: var(--cream);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        main { max-width: 480px; }
        .code {
            font-size: 4rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            color: var(--gold);
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 500;
            margin-bottom: 0.75rem;
            letter-spacing: 0.04em;
        }
        p {
            font-size: 0.95rem;
            line-height: 1.6;
            opacity: 0.7;
            margin-bottom: 1.5rem;
        }
        a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            border-bottom: 1px solid transparent;
            transition: border-color 0.3s ease;
        }
        a:hover, a:focus-visible {
            border-bottom-color: var(--gold);
            outline: none;
        }
    </style>
</head>
<body>
    <main>
        <div class="code">404</div>
        <h1>Page not found</h1>
        <p>The page you are looking for has moved or doesn't exist.</p>
        <p><a href="/">← Back to gallery</a></p>
    </main>
</body>
</html>
