    <style>
        :root {
            --gold: #c9a227;
            --sage: #8b9a7d;
            --blush: #d4a5a5;
            --cream: #faf8f5;
            --charcoal: #2a2a2a;
            --glass-bg: rgba(250, 248, 245, 0.85);
            --glass-border: rgba(255, 255, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--charcoal);
            background: var(--cream);
            min-height: 100vh;
            min-height: 100dvh;
        }

        img {
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            user-select: none;
        }

        *:focus {
            outline: 2px solid var(--gold);
            outline-offset: 2px;
        }

        *:focus:not(:focus-visible) {
            outline: none;
        }

        *:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 2px;
        }

        /* Header */
        .page-header {
            padding: 1.25rem 2rem;
            padding-top: max(1.25rem, env(safe-area-inset-top));
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        .page-header-logo {
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            color: var(--charcoal);
            text-transform: uppercase;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .page-header-logo:hover {
            color: var(--gold);
        }

        .back-nav {
            max-width: 900px;
            margin: 0 auto;
            padding: 1rem 1.5rem 0;
        }

        .back-nav a {
            font-size: 0.82rem;
            color: var(--gold);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.3s ease;
        }

        .back-nav a:hover {
            opacity: 0.7;
        }

        .lang-toggle {
            background: none;
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 4px;
            padding: 0.3rem 0.6rem;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            color: var(--charcoal);
            transition: border-color 0.3s ease;
        }

        .lang-toggle:hover {
            border-color: var(--gold);
        }

        .lang-option {
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        .lang-option.active {
            opacity: 1;
            font-weight: 600;
        }

        .lang-divider {
            opacity: 0.3;
            margin: 0 0.15rem;
        }

        /* Main layout */
        .artwork-page {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem 3rem;
        }

        /* Loading / error states */
        .page-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .page-state h1 {
            font-size: 1.4rem;
            font-weight: 500;
            margin-bottom: 0.75rem;
        }

        .page-state p {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 1.5rem;
        }

        .page-state a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .page-state a:hover {
            text-decoration: underline;
        }

        /* Artwork header */
        .artwork-header {
            margin-bottom: 1.5rem;
        }

        .artwork-title {
            font-size: clamp(1.4rem, 3vw, 2rem);
            font-weight: 500;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .artwork-series {
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 0.5rem;
        }

        .status-badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.3rem 0.8rem;
            border-radius: 3px;
        }

        .status-badge.available {
            background: rgba(139, 154, 125, 0.15);
            color: var(--sage);
        }

        .status-badge.reserved {
            background: rgba(201, 162, 39, 0.15);
            color: var(--gold);
        }

        .status-badge.sold {
            background: rgba(212, 165, 165, 0.2);
            color: #a07070;
        }

        /* Image */
        .artwork-image-wrapper {
            position: relative;
            margin-bottom: 2rem;
            cursor: pointer;
            overflow: hidden;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.03);
            text-align: center;
        }

        .artwork-image-wrapper img {
            display: block;
            max-width: 100%;
            max-height: 70vh;
            margin: 0 auto;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .artwork-image-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .image-hint {
            text-align: center;
            font-size: 0.7rem;
            color: rgba(0, 0, 0, 0.4);
            margin-top: 0.5rem;
            margin-bottom: 1.5rem;
        }

        /* Price block */
        .artwork-price {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--charcoal);
        }

        .artwork-price-note {
            font-size: 0.75rem;
            font-weight: 400;
            opacity: 0.5;
            display: block;
            margin-top: 0.2rem;
        }

        /* Details */
        .artwork-details {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.4rem 1.2rem;
            font-size: 0.88rem;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .detail-label {
            font-weight: 500;
            opacity: 0.6;
            white-space: nowrap;
        }

        .detail-value {
            font-weight: 400;
        }

        /* Description */
        .artwork-description {
            font-size: 0.9rem;
            line-height: 1.7;
            margin-bottom: 2rem;
            opacity: 0.85;
        }

        /* Divider */
        .section-divider {
            border: none;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            margin: 2rem 0;
        }

        /* Reservation section */
        .reservation-section {
            margin-bottom: 2rem;
        }

        .reservation-title {
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            margin-bottom: 0.6rem;
        }

        .reservation-notice {
            font-size: 0.82rem;
            line-height: 1.6;
            opacity: 0.65;
            margin-bottom: 1.5rem;
        }

        .reservation-sold {
            padding: 1.5rem;
            text-align: center;
            background: rgba(212, 165, 165, 0.1);
            border-radius: 6px;
            border: 1px solid rgba(212, 165, 165, 0.2);
        }

        .reservation-sold p {
            font-size: 0.9rem;
            font-weight: 500;
            color: #a07070;
            margin-bottom: 0.5rem;
        }

        .reservation-sold small {
            font-size: 0.8rem;
            opacity: 0.6;
        }

        /* Google Form embed */
        .form-embed {
            width: 100%;
            min-height: 600px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 6px;
            background: white;
        }

        /* Privacy note */
        .privacy-note {
            font-size: 0.75rem;
            opacity: 0.5;
            line-height: 1.6;
            margin-top: 1rem;
        }

        .privacy-note a {
            color: var(--gold);
            text-decoration: none;
        }

        .privacy-note a:hover {
            text-decoration: underline;
        }

        /* Fallback contact */
        .fallback-contact {
            margin-top: 1.5rem;
            font-size: 0.82rem;
            opacity: 0.55;
        }

        .fallback-contact a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 500;
        }

        .fallback-contact a:hover {
            text-decoration: underline;
        }

        /* Footer */
        .page-footer {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            font-size: 0.75rem;
            opacity: 0.6;
        }

        .page-footer a {
            color: var(--charcoal);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .page-footer a:hover {
            color: var(--gold);
        }

        /* Lightbox */
        .artwork-lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.95);
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .artwork-lightbox.active {
            display: flex;
        }

        .artwork-lightbox img {
            max-width: 95vw;
            max-height: 95vh;
            object-fit: contain;
            pointer-events: none;
        }

        .artwork-lightbox-close {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            padding: 0.5rem;
            line-height: 1;
            opacity: 0.7;
            transition: opacity 0.3s ease;
            z-index: 1;
        }

        .artwork-lightbox-close:hover {
            opacity: 1;
        }

        /* Image protection */
        .artwork-lightbox::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .artwork-lightbox img {
            z-index: 1;
        }

        .artwork-lightbox-close {
            z-index: 2;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .back-nav {
                padding: 0.75rem 1rem 0;
            }

            .artwork-page {
                padding: 1.25rem 1rem 2rem;
            }

            .artwork-details {
                grid-template-columns: 1fr;
                gap: 0.15rem;
            }

            .detail-label {
                margin-top: 0.5rem;
            }

            .detail-label:first-child {
                margin-top: 0;
            }

            .form-embed {
                min-height: 1375px;
                min-height: 180svh;
            }

            .page-footer {
                flex-direction: column;
                gap: 0.5rem;
                text-align: center;
            }
        }

        /* Right-click protection */
        .artwork-image-wrapper,
        .artwork-lightbox {
            -webkit-touch-callout: none;
            user-select: none;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="page-header">
        <a href="index.html" class="page-header-logo">Dagmara Dreams of Nihonga</a>
        <button type="button" class="lang-toggle" id="lang-toggle" aria-label="Switch language">
            <span class="lang-option" data-lang="en">EN</span>
            <span class="lang-divider">|</span>
            <span class="lang-option" data-lang="pl">PL</span>
        </button>
    </header>

    <nav class="back-nav">
        <a href="index.html#catalog" id="back-link">← Back to gallery</a>
    </nav>

    <!-- Main content (populated by JS) -->
    <main class="artwork-page" id="artwork-page">
        <div class="page-state" id="loading-state">
            <p>Loading artwork...</p>
        </div>
    </main>

    <!-- Fullscreen lightbox -->
    <div class="artwork-lightbox" id="artwork-lightbox" role="dialog" aria-label="Fullscreen image" aria-hidden="true">
        <button class="artwork-lightbox-close" aria-label="Close fullscreen">&times;</button>
        <img src="" alt="" id="lightbox-full-image">
    </div>

    <!-- Footer -->
    <footer class="page-footer">
        <span>&copy; 2026 Dagmara Okła</span>
        <a href="privacy.html" id="footer-privacy-link">Privacy Policy</a>
    </footer>

    <script>
        // ── Configuration ──
        const GOOGLE_FORM_URLS = {
            en: 'https://docs.google.com/forms/d/e/1FAIpQLSf21tJadmFA9toHrdwm5fyesUzbfCCCCjzkxqMQypdOyiwDjg/viewform',
            pl: 'https://docs.google.com/forms/d/e/1FAIpQLSeZgm39OWtcQu7jUU3MqVryN5sw8X4sohSIQTAlrvBjrqQD4Q/viewform'
        };

        // Both forms share the same entry field IDs
        const FORM_ENTRY_IDS = {
            artworkTitle:   'entry.753153282',
            privacyConsent: 'entry.422486235'
        };

        // ── Translations ──
        const translations = {
            en: {
                'page.loading': 'Loading artwork...',
                'page.notFoundTitle': 'Artwork not found',
                'page.notFoundText': 'The artwork you are looking for could not be found.',
                'page.backLink': '← Back to gallery',
                'artwork.tapToEnlarge': 'Tap image to view fullscreen',
                'artwork.priceOnRequest': 'Price on request',
                'artwork.dimensions': 'Dimensions',
                'artwork.material': 'Material',
                'artwork.paper': 'Paper',
                'artwork.year': 'Year',
                'artwork.series': 'Series',
                'artwork.statusAvailable': 'Available',
                'artwork.statusReserved': 'Reserved',
                'artwork.statusSold': 'Sold',
                'reservation.title': 'Reservation Request',
                'reservation.notice': 'Submitting this form does not automatically reserve the artwork. I will review your request and confirm availability by email or phone.',
                'reservation.soldTitle': 'This artwork has been sold',
                'reservation.soldText': 'If you are interested in a similar piece, please get in touch.',
                'reservation.reservedNotice': 'This artwork is currently reserved. You can still submit a request and I will contact you if it becomes available.',
                'privacy.note': 'By submitting this form, you agree that your contact details will be used only to respond to this reservation request. See our',
                'privacy.linkText': 'Privacy Policy',
                'fallback.text': 'Having trouble with the form?',
                'fallback.linkText': 'Contact me directly',
                'footer.privacy': 'Privacy Policy'
            },
            pl: {
                'page.loading': 'Ładowanie dzieła...',
                'page.notFoundTitle': 'Dzieło nie znalezione',
                'page.notFoundText': 'Dzieło, którego szukasz, nie zostało znalezione.',
                'page.backLink': '← Powrót do galerii',
                'artwork.tapToEnlarge': 'Dotknij obrazu, aby powiększyć',
                'artwork.priceOnRequest': 'Cena na zapytanie',
                'artwork.dimensions': 'Wymiary',
                'artwork.material': 'Podłoże',
                'artwork.paper': 'Papier',
                'artwork.year': 'Rok',
                'artwork.series': 'Seria',
                'artwork.statusAvailable': 'Dostępne',
                'artwork.statusReserved': 'Zarezerwowane',
                'artwork.statusSold': 'Sprzedane',
                'reservation.title': 'Zapytanie o rezerwację',
                'reservation.notice': 'Wysłanie formularza nie oznacza automatycznej rezerwacji dzieła. Przejrzę Twoje zgłoszenie i potwierdzę dostępność mailem lub telefonicznie.',
                'reservation.soldTitle': 'To dzieło zostało sprzedane',
                'reservation.soldText': 'Jeśli interesujesz się podobnym dziełem, proszę o kontakt.',
                'reservation.reservedNotice': 'To dzieło jest obecnie zarezerwowane. Możesz wysłać zapytanie — skontaktuję się, jeśli stanie się dostępne.',
                'privacy.note': 'Wysyłając formularz, wyrażasz zgodę na przetwarzanie danych kontaktowych wyłącznie w celu odpowiedzi na zapytanie o rezerwację. Zobacz naszą',
                'privacy.linkText': 'Politykę prywatności',
                'fallback.text': 'Problemy z formularzem?',
                'fallback.linkText': 'Skontaktuj się bezpośrednio',
                'footer.privacy': 'Polityka prywatności'
            }
        };

        let currentLang = 'en';

        function t(key) {
            return (translations[currentLang] && translations[currentLang][key]) || translations.en[key] || key;
        }

        // ── Language detection ──
        function initLanguage() {
            const saved = localStorage.getItem('lang');
            if (saved && translations[saved]) {
                currentLang = saved;
            } else {
                const browserLang = (navigator.language || '').toLowerCase();
                if (browserLang.startsWith('pl')) {
                    currentLang = 'pl';
                }
            }
            updateLangToggle();
        }

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            updateLangToggle();
            renderArtwork();
        }

        function updateLangToggle() {
            document.querySelectorAll('.lang-option').forEach(opt => {
                opt.classList.toggle('active', opt.dataset.lang === currentLang);
            });
        }

        // ── Email obfuscation ──
        function getEmail() {
            const parts = ['dagmaraokla', '.', 'art', '@', 'gmail', '.', 'com'];
            return parts.join('');
        }

        // ── State ──
        let artwork = null;
        let allArtworks = [];

        // ── Load artworks ──
        async function loadArtworks() {
            try {
                const response = await fetch('Data/artworks.json');
                if (!response.ok) throw new Error('Fetch failed');
                allArtworks = await response.json();
            } catch (err) {
                console.warn('Failed to load artworks.json', err);
                allArtworks = [];
            }

            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            const id = params.get('id');

            if (slug) {
                artwork = allArtworks.find(a => a.slug === slug);
            } else if (id) {
                artwork = allArtworks.find(a => a.id === id);
            }

            renderArtwork();
        }

        // ── Build Google Form embed URL ──
        function buildFormUrl(art) {
            const baseUrl = GOOGLE_FORM_URLS[currentLang] || GOOGLE_FORM_URLS.en;
            if (!baseUrl || baseUrl.includes('PLACEHOLDER')) {
                return null;
            }

            const params = new URLSearchParams();
            params.set(FORM_ENTRY_IDS.artworkTitle, art.title);

            return `${baseUrl}?${params.toString()}&embedded=true`;
        }

        // ── Render ──
        function renderArtwork() {
            const page = document.getElementById('artwork-page');

            if (!artwork) {
                page.innerHTML = `
                    <div class="page-state">
                        <h1>${t('page.notFoundTitle')}</h1>
                        <p>${t('page.notFoundText')}</p>
                        <a href="index.html#catalog">${t('page.backLink')}</a>
                    </div>`;
                document.title = `${t('page.notFoundTitle')} — Dagmara Dreams of Nihonga`;
                return;
            }

            const art = artwork;
            document.title = `${art.title} — Dagmara Dreams of Nihonga`;

            const statusKey = (art.status || 'available').toLowerCase();
            const statusLabels = {
                available: t('artwork.statusAvailable'),
                reserved: t('artwork.statusReserved'),
                sold: t('artwork.statusSold')
            };

            const description = currentLang === 'pl' ? (art.descriptionPl || art.descriptionEn || '') : (art.descriptionEn || '');

            const priceText = (!art.priceDisplay || art.priceDisplay.trim() === '')
                ? t('artwork.priceOnRequest')
                : art.priceDisplay;

            const paperLabel = currentLang === 'pl' ? 'Papier' : 'Paper';
            let paperText = art.paper || '';
            if (paperText.startsWith('Japanese paper ')) {
                const paperName = paperText.replace('Japanese paper ', '');
                paperText = currentLang === 'pl' ? `Papier japoński ${paperName}` : `Japanese paper ${paperName}`;
            }

            let detailsHtml = `
                <span class="detail-label">${t('artwork.dimensions')}</span>
                <span class="detail-value">${art.dimensions}</span>`;

            if (art.material) {
                detailsHtml += `
                <span class="detail-label">${t('artwork.material')}</span>
                <span class="detail-value">${art.material}</span>`;
            }

            if (paperText) {
                detailsHtml += `
                <span class="detail-label">${t('artwork.paper')}</span>
                <span class="detail-value">${paperText}</span>`;
            }

            if (art.year) {
                detailsHtml += `
                <span class="detail-label">${t('artwork.year')}</span>
                <span class="detail-value">${art.year}</span>`;
            }

            // Reservation section
            let reservationHtml = '';
            const formUrl = buildFormUrl(art);

            if (statusKey === 'sold') {
                reservationHtml = `
                    <div class="reservation-sold">
                        <p>${t('reservation.soldTitle')}</p>
                        <small>${t('reservation.soldText')}</small>
                    </div>`;
            } else {
                const notice = statusKey === 'reserved'
                    ? t('reservation.reservedNotice')
                    : t('reservation.notice');

                let formHtml = '';
                if (formUrl) {
                    formHtml = `<iframe class="form-embed" src="${formUrl}" frameborder="0" marginheight="0" marginwidth="0" title="Reservation request form" loading="lazy">Loading…</iframe>`;
                    trackEventOnce('reservation_form_loaded', {
                        'artwork_title': art.title,
                        'artwork_slug': art.slug || '',
                        'artwork_status': statusKey,
                        'language': currentLang
                    });
                } else {
                    formHtml = `<div class="reservation-sold" style="border-color: rgba(201, 162, 39, 0.2); background: rgba(201, 162, 39, 0.06);">
                        <p style="color: var(--gold);">${currentLang === 'pl' ? 'Formularz rezerwacji zostanie wkrótce uruchomiony.' : 'Reservation form coming soon.'}</p>
                        <small>${t('fallback.text')} <a href="mailto:${getEmail()}">${t('fallback.linkText')}</a></small>
                    </div>`;
                }

                reservationHtml = `
                    <p class="reservation-notice">${notice}</p>
                    ${formHtml}
                    <div class="privacy-note">
                        ${t('privacy.note')} <a href="privacy.html">${t('privacy.linkText')}</a>.
                    </div>`;

                if (formUrl) {
                    reservationHtml += `
                    <div class="fallback-contact">
                        ${t('fallback.text')} <a href="mailto:${getEmail()}">${t('fallback.linkText')}</a>
                    </div>`;
                }
            }

            page.innerHTML = `
                <!-- Artwork header -->
                <div class="artwork-header">
                    ${art.series ? `<div class="artwork-series">${art.series}</div>` : ''}
                    <h1 class="artwork-title">${art.title}</h1>
                    <span class="status-badge ${statusKey}">${statusLabels[statusKey] || statusLabels.available}</span>
                </div>

                <!-- Image -->
                <div class="artwork-image-wrapper" id="artwork-image-trigger" role="button" tabindex="0" aria-label="${currentLang === 'pl' ? 'Kliknij aby powiększyć' : 'Click to enlarge'}">
                    <img src="Data/Lightbox_new/Preview/${art.filename}.webp"
                         alt="${art.title} — Nihonga painting"
                         id="artwork-main-image"
                         data-fullsrc="Data/Lightbox_new/Original/${art.filename}.webp">
                </div>
                <div class="image-hint">${t('artwork.tapToEnlarge')}</div>

                <!-- Price -->
                <div class="artwork-price">
                    ${priceText}
                    ${(!art.priceDisplay || art.priceDisplay.trim() === '') ? '' : `<span class="artwork-price-note">${currentLang === 'pl' ? 'Cena zawiera certyfikat autentyczności' : 'Price includes certificate of authenticity'}</span>`}
                </div>

                <!-- Details -->
                <div class="artwork-details">
                    ${detailsHtml}
                </div>

                <!-- Description -->
                ${description ? `<p class="artwork-description">${description}</p>` : ''}

                <hr class="section-divider">

                <!-- Reservation -->
                <div class="reservation-section">
                    <h2 class="reservation-title">${t('reservation.title')}</h2>
                    ${reservationHtml}
                </div>
            `;

            // Re-attach lightbox listener
            setupLightbox();
            updateFooterText();

            trackEventOnce('artwork_view', {
                'artwork_title': art.title,
                'artwork_slug': art.slug || '',
                'artwork_status': statusKey,
                'artwork_series': art.series || '',
                'language': currentLang,
                'referrer': document.referrer
            });
        }

        // ── Analytics ──
        const _firedOnce = {};
        function trackEvent(eventName, params = {}) {
            if (typeof gtag === 'function') {
                gtag('event', eventName, params);
            }
        }
        function trackEventOnce(eventName, params = {}) {
            if (_firedOnce[eventName]) return;
            _firedOnce[eventName] = true;
            trackEvent(eventName, params);
        }

        // ── Lightbox ──
        let lightboxAC = null;

        function setupLightbox() {
            if (lightboxAC) lightboxAC.abort();
            lightboxAC = new AbortController();
            const sig = { signal: lightboxAC.signal };

            const trigger = document.getElementById('artwork-image-trigger');
            const lightbox = document.getElementById('artwork-lightbox');
            const lightboxImg = document.getElementById('lightbox-full-image');
            const closeBtn = lightbox.querySelector('.artwork-lightbox-close');

            if (!trigger) return;

            function openLightbox() {
                const mainImg = document.getElementById('artwork-main-image');
                const fullSrc = mainImg.dataset.fullsrc || mainImg.src;
                lightboxImg.src = fullSrc;
                lightboxImg.alt = mainImg.alt;
                lightbox.classList.add('active');
                lightbox.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
                closeBtn.focus();
                if (artwork) {
                    trackEvent('artwork_image_enlarge', {
                        'artwork_title': artwork.title,
                        'artwork_slug': artwork.slug || ''
                    });
                }
            }

            function closeLightbox() {
                lightbox.classList.remove('active');
                lightbox.setAttribute('aria-hidden', 'true');
                document.body.style.overflow = '';
                trigger.focus();
            }

            trigger.addEventListener('click', openLightbox, sig);
            trigger.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    openLightbox();
                }
            }, sig);

            closeBtn.addEventListener('click', closeLightbox, sig);
            lightbox.addEventListener('click', e => {
                if (e.target === lightbox) closeLightbox();
            }, sig);

            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                    closeLightbox();
                }
            }, sig);
        }

        // ── Footer & nav text update ──
        function updateFooterText() {
            const link = document.getElementById('footer-privacy-link');
            if (link) link.textContent = t('footer.privacy');

            const backNav = document.getElementById('back-link');
            if (backNav) backNav.textContent = currentLang === 'pl' ? '← Powrót do galerii' : '← Back to gallery';
        }

        // ── Image protection ──
        document.addEventListener('contextmenu', e => {
            if (e.target.tagName === 'IMG' ||
                e.target.closest('.artwork-image-wrapper') ||
                e.target.closest('.artwork-lightbox')) {
                e.preventDefault();
            }
        });

        document.addEventListener('dragstart', e => {
            if (e.target.tagName === 'IMG') e.preventDefault();
        });

        // ── Language toggle ──
        document.getElementById('lang-toggle').addEventListener('click', () => {
            const newLang = currentLang === 'en' ? 'pl' : 'en';
            trackEvent('language_switch', {
                'from_language': currentLang,
                'to_language': newLang,
                'page': 'artwork',
                'artwork_title': artwork ? artwork.title : ''
            });
            setLanguage(newLang);
        });

        // ── Init ──
        initLanguage();
        loadArtworks();
    </script>
</body>
</html>
