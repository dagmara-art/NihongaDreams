    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #c9a227;
            --sage: #8b9a7d;
            --blush: #d4a5a5;
            --error: #b85c5c;
            --cream: #faf8f5;
            --charcoal: #2a2a2a;
            --glass-bg: rgba(250, 248, 245, 0.85);
            --glass-border: rgba(255, 255, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--charcoal);
            background: var(--cream);
            min-height: 100vh;
            min-height: 100dvh;
        }

        img {
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            user-select: none;
        }

        *:focus {
            outline: 2px solid var(--gold);
            outline-offset: 2px;
        }

        *:focus:not(:focus-visible) {
            outline: none;
        }

        *:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 2px;
        }

        /* Header */
        .page-header {
            padding: 1.25rem 2rem;
            padding-top: max(1.25rem, env(safe-area-inset-top));
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        .page-header-logo {
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            color: var(--charcoal);
            text-transform: uppercase;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .page-header-logo:hover {
            color: var(--gold);
        }

        .back-nav {
            max-width: 900px;
            margin: 0 auto;
            padding: 1rem 1.5rem 0;
        }

        .back-nav a {
            font-size: 0.82rem;
            color: var(--gold);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.3s ease;
        }

        .back-nav a:hover {
            opacity: 0.7;
        }

        .lang-toggle {
            background: none;
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 4px;
            padding: 0.3rem 0.6rem;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            color: var(--charcoal);
            transition: border-color 0.3s ease;
        }

        .lang-toggle:hover {
            border-color: var(--gold);
        }

        .lang-option {
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        .lang-option.active {
            opacity: 1;
            font-weight: 600;
        }

        .lang-divider {
            opacity: 0.3;
            margin: 0 0.15rem;
        }

        /* Main layout */
        .artwork-page {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem 3rem;
        }

        /* Loading / error states */
        .page-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .page-state h1 {
            font-size: 1.4rem;
            font-weight: 500;
            margin-bottom: 0.75rem;
        }

        .page-state p {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 1.5rem;
        }

        .page-state a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .page-state a:hover {
            text-decoration: underline;
        }

        /* Artwork header */
        .artwork-header {
            margin-bottom: 1.5rem;
        }

        .artwork-title {
            font-size: clamp(1.4rem, 3vw, 2rem);
            font-weight: 500;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .artwork-series {
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 0.5rem;
        }

        .status-badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.3rem 0.8rem;
            border-radius: 3px;
        }

        .status-badge.available {
            background: rgba(139, 154, 125, 0.15);
            color: var(--sage);
        }

        .status-badge.reserved {
            background: rgba(201, 162, 39, 0.15);
            color: var(--gold);
        }

        .status-badge.sold {
            background: rgba(212, 165, 165, 0.2);
            color: #a07070;
        }

        /* Image */
        .artwork-image-wrapper {
            position: relative;
            margin-bottom: 2rem;
            cursor: pointer;
            overflow: hidden;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.03);
            text-align: center;
        }

        .artwork-image-wrapper img {
            display: block;
            max-width: 100%;
            max-height: 70vh;
            margin: 0 auto;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .artwork-image-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .sold-ribbon {
            position: absolute;
            top: 0;
            right: 0;
            z-index: 2;
            width: 8.75rem;
            height: 8.75rem;
            overflow: hidden;
            pointer-events: none;
        }

        .sold-ribbon__text {
            position: absolute;
            top: 1.95rem;
            right: -3.15rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 12rem;
            box-sizing: border-box;
            padding: 0.42rem 0;
            transform: rotate(45deg);
            transform-origin: center;
            border-top: 1px solid rgba(255, 246, 218, 0.48);
            border-bottom: 1px solid rgba(74, 10, 10, 0.52);
            background:
                linear-gradient(180deg, rgba(178, 45, 35, 0.98) 0%, rgba(112, 19, 19, 0.98) 100%);
            box-shadow:
                0 5px 14px rgba(0, 0, 0, 0.34),
                inset 0 1px 0 rgba(255, 255, 255, 0.22);
            color: #fff7e6;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            line-height: 1;
            text-align: center;
            white-space: nowrap;
            text-shadow: 0 1px 1px rgba(45, 7, 7, 0.5);
        }

        .image-hint {
            text-align: center;
            font-size: 0.7rem;
            color: rgba(0, 0, 0, 0.4);
            margin-top: 0.5rem;
            margin-bottom: 1.5rem;
        }

        /* Price block */
        .artwork-price {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--charcoal);
        }

        .artwork-price-note {
            font-size: 0.75rem;
            font-weight: 400;
            opacity: 0.5;
            display: block;
            margin-top: 0.2rem;
        }

        /* Details */
        .artwork-details {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.4rem 1.2rem;
            font-size: 0.88rem;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .detail-label {
            font-weight: 500;
            opacity: 0.6;
            white-space: nowrap;
        }

        .detail-value {
            font-weight: 400;
        }

        /* Description */
        .artwork-description {
            font-size: 0.9rem;
            line-height: 1.7;
            margin-bottom: 2rem;
            opacity: 0.85;
        }

        /* Divider */
        .section-divider {
            border: none;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            margin: 2rem 0;
        }

        /* Reservation section */
        .reservation-section {
            margin-bottom: 2rem;
        }

        .reservation-title {
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            margin-bottom: 0.6rem;
        }

        .reservation-notice {
            font-size: 0.82rem;
            line-height: 1.6;
            opacity: 0.65;
            margin-bottom: 1.5rem;
        }

        .reservation-sold {
            padding: 1.5rem;
            text-align: center;
            background: rgba(212, 165, 165, 0.1);
            border-radius: 6px;
            border: 1px solid rgba(212, 165, 165, 0.2);
        }

        .reservation-sold p {
            font-size: 0.9rem;
            font-weight: 500;
            color: #a07070;
            margin-bottom: 0.5rem;
        }

        .reservation-sold small {
            font-size: 0.8rem;
            opacity: 0.6;
        }

        /* Native reservation form */
        .reservation-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .form-field label {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0.6;
        }

        .form-field .required-mark {
            color: var(--error);
            margin-left: 0.15rem;
        }

        .form-field input,
        .form-field textarea {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            padding: 0.7rem 0.9rem;
            border: 1px solid rgba(0, 0, 0, 0.12);
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.5);
            color: var(--charcoal);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-field input:focus,
        .form-field textarea:focus {
            outline: 2px solid var(--gold);
            outline-offset: 2px;
            border-color: var(--gold);
        }

        .form-field input::placeholder,
        .form-field textarea::placeholder {
            opacity: 0.4;
        }

        .form-field textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-field-error input,
        .form-field-error textarea {
            border-color: var(--error);
        }

        .form-error-msg {
            font-size: 0.75rem;
            color: var(--error);
            display: none;
        }

        .form-field-error .form-error-msg {
            display: block;
        }

        .form-consent {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            font-size: 0.82rem;
            line-height: 1.5;
        }

        .form-consent input[type="checkbox"] {
            margin-top: 0.2rem;
            accent-color: var(--gold);
            min-width: 16px;
            min-height: 16px;
        }

        .form-consent a {
            color: var(--gold);
            text-decoration: none;
        }

        .form-consent a:hover {
            text-decoration: underline;
        }

        .form-consent-error {
            color: var(--error);
        }

        .form-hp {
            position: absolute;
            left: -9999px;
            opacity: 0;
            height: 0;
            overflow: hidden;
        }

        .form-submit-btn {
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 0.85rem 2rem;
            border: 1px solid var(--gold);
            border-radius: 4px;
            background: transparent;
            color: var(--gold);
            cursor: pointer;
            transition: all 0.3s ease;
            align-self: flex-start;
        }

        .form-submit-btn:hover {
            background: var(--gold);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(201, 162, 39, 0.3);
        }

        .form-submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            background: transparent;
            color: var(--gold);
        }

        .form-status {
            padding: 1rem 1.25rem;
            border-radius: 6px;
            font-size: 0.88rem;
            line-height: 1.5;
            display: none;
        }

        .form-status.loading {
            display: block;
            background: rgba(201, 162, 39, 0.08);
            border: 1px solid rgba(201, 162, 39, 0.2);
            color: var(--gold);
        }

        .form-status.success {
            display: block;
            background: rgba(139, 154, 125, 0.12);
            border: 1px solid rgba(139, 154, 125, 0.25);
            color: var(--sage);
        }

        .form-status.error {
            display: block;
            background: rgba(212, 165, 165, 0.12);
            border: 1px solid rgba(212, 165, 165, 0.25);
            color: #a07070;
        }

        /* Privacy note */
        .privacy-note {
            font-size: 0.75rem;
            opacity: 0.5;
            line-height: 1.6;
            margin-top: 1rem;
        }

        .privacy-note a {
            color: var(--gold);
            text-decoration: none;
        }

        .privacy-note a:hover {
            text-decoration: underline;
        }

        /* Fallback contact */
        .fallback-contact {
            margin-top: 1.5rem;
            font-size: 0.82rem;
            opacity: 0.55;
        }

        .fallback-contact a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 500;
        }

        .fallback-contact a:hover {
            text-decoration: underline;
        }

        /* Footer */
        .page-footer {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            font-size: 0.75rem;
            opacity: 0.6;
        }

        .page-footer a {
            color: var(--charcoal);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .page-footer a:hover {
            color: var(--gold);
        }

        /* Lightbox */
        .artwork-lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.95);
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .artwork-lightbox.active {
            display: flex;
        }

        .artwork-lightbox .sold-ribbon {
            top: 0;
            right: 0;
            z-index: 3;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .artwork-lightbox.has-sold-ribbon .sold-ribbon {
            opacity: 1;
        }

        .artwork-lightbox img {
            max-width: 95vw;
            max-height: 95vh;
            object-fit: contain;
            pointer-events: none;
        }

        .artwork-lightbox-close {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            padding: 0.5rem;
            line-height: 1;
            opacity: 0.7;
            transition: opacity 0.3s ease;
            z-index: 1;
        }

        .artwork-lightbox-close:hover {
            opacity: 1;
        }

        /* Image protection */
        .artwork-lightbox::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .artwork-lightbox img {
            z-index: 1;
        }

        .artwork-lightbox-close {
            z-index: 2;
        }

        .artwork-lightbox.has-sold-ribbon .artwork-lightbox-close {
            right: 10rem;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .back-nav {
                padding: 0.75rem 1rem 0;
            }

            .artwork-page {
                padding: 1.25rem 1rem 2rem;
            }

            .artwork-details {
                grid-template-columns: 1fr;
                gap: 0.15rem;
            }

            .detail-label {
                margin-top: 0.5rem;
            }

            .detail-label:first-child {
                margin-top: 0;
            }

            .form-submit-btn {
                width: 100%;
                text-align: center;
            }

            .page-footer {
                flex-direction: column;
                gap: 0.5rem;
                text-align: center;
            }
        }

        /* Right-click protection */
        .artwork-image-wrapper,
        .artwork-lightbox {
            -webkit-touch-callout: none;
            user-select: none;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="page-header">
        <a href="index.html" class="page-header-logo">Dagmara Dreams of Nihonga</a>
        <button type="button" class="lang-toggle" id="lang-toggle" aria-label="Switch language">
            <span class="lang-option" data-lang="en">EN</span>
            <span class="lang-divider">|</span>
            <span class="lang-option" data-lang="pl">PL</span>
        </button>
    </header>

    <nav class="back-nav">
        <a href="index.html#catalog" id="back-link">&larr; Back to gallery</a>
    </nav>

    <!-- Main content (populated by JS) -->
    <main class="artwork-page" id="artwork-page">
        <div class="page-state" id="loading-state">
            <p>Loading artwork...</p>
        </div>
    </main>

    <!-- Fullscreen lightbox -->
    <div class="artwork-lightbox" id="artwork-lightbox" role="dialog" aria-label="Fullscreen image" aria-hidden="true">
        <button class="artwork-lightbox-close" aria-label="Close fullscreen">&times;</button>
        <img src="" alt="" id="lightbox-full-image">
        <span class="sold-ribbon" id="artwork-lightbox-sold-ribbon" aria-hidden="true">
            <span class="sold-ribbon__text">売約済 / SOLD</span>
        </span>
    </div>

    <!-- Footer -->
    <footer class="page-footer">
        <span>&copy; 2026 Dagmara Ok&lstrok;a</span>
        <a href="privacy.html" id="footer-privacy-link">Privacy Policy</a>
    </footer>

    <script type="module" src="js/pages/artwork/init.js"></script>
</body>
</html>
