    <style>
        :root {
            --gold: #c9a227;
            --sage: #8b9a7d;
            --blush: #d4a5a5;
            --error: #b85c5c;
            --cream: #faf8f5;
            --charcoal: #2a2a2a;
            --glass-bg: rgba(250, 248, 245, 0.85);
            --glass-border: rgba(255, 255, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--charcoal);
            background: var(--cream);
            min-height: 100vh;
            min-height: 100dvh;
        }

        img {
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            user-select: none;
        }

        *:focus {
            outline: 2px solid var(--gold);
            outline-offset: 2px;
        }

        *:focus:not(:focus-visible) {
            outline: none;
        }

        *:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 2px;
        }

        /* Header */
        .page-header {
            padding: 1.25rem 2rem;
            padding-top: max(1.25rem, env(safe-area-inset-top));
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        .page-header-logo {
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            color: var(--charcoal);
            text-transform: uppercase;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .page-header-logo:hover {
            color: var(--gold);
        }

        .back-nav {
            max-width: 900px;
            margin: 0 auto;
            padding: 1rem 1.5rem 0;
        }

        .back-nav a {
            font-size: 0.82rem;
            color: var(--gold);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.3s ease;
        }

        .back-nav a:hover {
            opacity: 0.7;
        }

        .lang-toggle {
            background: none;
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 4px;
            padding: 0.3rem 0.6rem;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            color: var(--charcoal);
            transition: border-color 0.3s ease;
        }

        .lang-toggle:hover {
            border-color: var(--gold);
        }

        .lang-option {
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        .lang-option.active {
            opacity: 1;
            font-weight: 600;
        }

        .lang-divider {
            opacity: 0.3;
            margin: 0 0.15rem;
        }

        /* Main layout */
        .artwork-page {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem 3rem;
        }

        /* Loading / error states */
        .page-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .page-state h1 {
            font-size: 1.4rem;
            font-weight: 500;
            margin-bottom: 0.75rem;
        }

        .page-state p {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 1.5rem;
        }

        .page-state a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .page-state a:hover {
            text-decoration: underline;
        }

        /* Artwork header */
        .artwork-header {
            margin-bottom: 1.5rem;
        }

        .artwork-title {
            font-size: clamp(1.4rem, 3vw, 2rem);
            font-weight: 500;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .artwork-series {
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 0.5rem;
        }

        .status-badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.3rem 0.8rem;
            border-radius: 3px;
        }

        .status-badge.available {
            background: rgba(139, 154, 125, 0.15);
            color: var(--sage);
        }

        .status-badge.reserved {
            background: rgba(201, 162, 39, 0.15);
            color: var(--gold);
        }

        .status-badge.sold {
            background: rgba(212, 165, 165, 0.2);
            color: #a07070;
        }

        /* Image */
        .artwork-image-wrapper {
            position: relative;
            margin-bottom: 2rem;
            cursor: pointer;
            overflow: hidden;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.03);
            text-align: center;
        }

        .artwork-image-wrapper img {
            display: block;
            max-width: 100%;
            max-height: 70vh;
            margin: 0 auto;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .artwork-image-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .image-hint {
            text-align: center;
            font-size: 0.7rem;
            color: rgba(0, 0, 0, 0.4);
            margin-top: 0.5rem;
            margin-bottom: 1.5rem;
        }

        /* Price block */
        .artwork-price {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--charcoal);
        }

        .artwork-price-note {
            font-size: 0.75rem;
            font-weight: 400;
            opacity: 0.5;
            display: block;
            margin-top: 0.2rem;
        }

        /* Details */
        .artwork-details {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.4rem 1.2rem;
            font-size: 0.88rem;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .detail-label {
            font-weight: 500;
            opacity: 0.6;
            white-space: nowrap;
        }

        .detail-value {
            font-weight: 400;
        }

        /* Description */
        .artwork-description {
            font-size: 0.9rem;
            line-height: 1.7;
            margin-bottom: 2rem;
            opacity: 0.85;
        }

        /* Divider */
        .section-divider {
            border: none;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            margin: 2rem 0;
        }

        /* Reservation section */
        .reservation-section {
            margin-bottom: 2rem;
        }

        .reservation-title {
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            margin-bottom: 0.6rem;
        }

        .reservation-notice {
            font-size: 0.82rem;
            line-height: 1.6;
            opacity: 0.65;
            margin-bottom: 1.5rem;
        }

        .reservation-sold {
            padding: 1.5rem;
            text-align: center;
            background: rgba(212, 165, 165, 0.1);
            border-radius: 6px;
            border: 1px solid rgba(212, 165, 165, 0.2);
        }

        .reservation-sold p {
            font-size: 0.9rem;
            font-weight: 500;
            color: #a07070;
            margin-bottom: 0.5rem;
        }

        .reservation-sold small {
            font-size: 0.8rem;
            opacity: 0.6;
        }

        /* Native reservation form */
        .reservation-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .form-field label {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0.6;
        }

        .form-field .required-mark {
            color: var(--error);
            margin-left: 0.15rem;
        }

        .form-field input,
        .form-field textarea {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            padding: 0.7rem 0.9rem;
            border: 1px solid rgba(0, 0, 0, 0.12);
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.5);
            color: var(--charcoal);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-field input:focus,
        .form-field textarea:focus {
            outline: 2px solid var(--gold);
            outline-offset: 2px;
            border-color: var(--gold);
        }

        .form-field input::placeholder,
        .form-field textarea::placeholder {
            opacity: 0.4;
        }

        .form-field textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-field-error input,
        .form-field-error textarea {
            border-color: var(--error);
        }

        .form-error-msg {
            font-size: 0.75rem;
            color: var(--error);
            display: none;
        }

        .form-field-error .form-error-msg {
            display: block;
        }

        .form-consent {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            font-size: 0.82rem;
            line-height: 1.5;
        }

        .form-consent input[type="checkbox"] {
            margin-top: 0.2rem;
            accent-color: var(--gold);
            min-width: 16px;
            min-height: 16px;
        }

        .form-consent a {
            color: var(--gold);
            text-decoration: none;
        }

        .form-consent a:hover {
            text-decoration: underline;
        }

        .form-consent-error {
            color: var(--error);
        }

        .form-hp {
            position: absolute;
            left: -9999px;
            opacity: 0;
            height: 0;
            overflow: hidden;
        }

        .form-submit-btn {
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 0.85rem 2rem;
            border: 1px solid var(--gold);
            border-radius: 4px;
            background: transparent;
            color: var(--gold);
            cursor: pointer;
            transition: all 0.3s ease;
            align-self: flex-start;
        }

        .form-submit-btn:hover {
            background: var(--gold);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(201, 162, 39, 0.3);
        }

        .form-submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            background: transparent;
            color: var(--gold);
        }

        .form-status {
            padding: 1rem 1.25rem;
            border-radius: 6px;
            font-size: 0.88rem;
            line-height: 1.5;
            display: none;
        }

        .form-status.loading {
            display: block;
            background: rgba(201, 162, 39, 0.08);
            border: 1px solid rgba(201, 162, 39, 0.2);
            color: var(--gold);
        }

        .form-status.success {
            display: block;
            background: rgba(139, 154, 125, 0.12);
            border: 1px solid rgba(139, 154, 125, 0.25);
            color: var(--sage);
        }

        .form-status.error {
            display: block;
            background: rgba(212, 165, 165, 0.12);
            border: 1px solid rgba(212, 165, 165, 0.25);
            color: #a07070;
        }

        /* Privacy note */
        .privacy-note {
            font-size: 0.75rem;
            opacity: 0.5;
            line-height: 1.6;
            margin-top: 1rem;
        }

        .privacy-note a {
            color: var(--gold);
            text-decoration: none;
        }

        .privacy-note a:hover {
            text-decoration: underline;
        }

        /* Fallback contact */
        .fallback-contact {
            margin-top: 1.5rem;
            font-size: 0.82rem;
            opacity: 0.55;
        }

        .fallback-contact a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 500;
        }

        .fallback-contact a:hover {
            text-decoration: underline;
        }

        /* Footer */
        .page-footer {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            font-size: 0.75rem;
            opacity: 0.6;
        }

        .page-footer a {
            color: var(--charcoal);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .page-footer a:hover {
            color: var(--gold);
        }

        /* Lightbox */
        .artwork-lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.95);
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .artwork-lightbox.active {
            display: flex;
        }

        .artwork-lightbox img {
            max-width: 95vw;
            max-height: 95vh;
            object-fit: contain;
            pointer-events: none;
        }

        .artwork-lightbox-close {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            padding: 0.5rem;
            line-height: 1;
            opacity: 0.7;
            transition: opacity 0.3s ease;
            z-index: 1;
        }

        .artwork-lightbox-close:hover {
            opacity: 1;
        }

        /* Image protection */
        .artwork-lightbox::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .artwork-lightbox img {
            z-index: 1;
        }

        .artwork-lightbox-close {
            z-index: 2;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .back-nav {
                padding: 0.75rem 1rem 0;
            }

            .artwork-page {
                padding: 1.25rem 1rem 2rem;
            }

            .artwork-details {
                grid-template-columns: 1fr;
                gap: 0.15rem;
            }

            .detail-label {
                margin-top: 0.5rem;
            }

            .detail-label:first-child {
                margin-top: 0;
            }

            .form-submit-btn {
                width: 100%;
                text-align: center;
            }

            .page-footer {
                flex-direction: column;
                gap: 0.5rem;
                text-align: center;
            }
        }

        /* Right-click protection */
        .artwork-image-wrapper,
        .artwork-lightbox {
            -webkit-touch-callout: none;
            user-select: none;
        }
    </style>
</head>

                'reservation.notice': 'Wysłanie formularza nie oznacza automatycznej rezerwacji dzieła. Przejrzę Twoje zgłoszenie i potwierdzę dostępność mailem lub telefonicznie.',
                'reservation.soldTitle': 'To dzieło zostało sprzedane',
                'reservation.soldText': 'Jeśli interesujesz się podobnym dziełem, proszę o kontakt.',
                'reservation.reservedNotice': 'To dzieło jest obecnie zarezerwowane. Możesz wysłać zapytanie — skontaktuję się, jeśli stanie się dostępne.',
                'privacy.note': 'Wysyłając formularz, wyrażasz zgodę na przetwarzanie danych kontaktowych wyłącznie w celu odpowiedzi na zapytanie o rezerwację. Zobacz naszą',
                'privacy.linkText': 'Politykę prywatności',
                'fallback.text': 'Problemy z formularzem?',
                'fallback.linkText': 'Skontaktuj się bezpośrednio',
                'footer.privacy': 'Polityka prywatności',
                'form.name': 'Imię i nazwisko',
                'form.namePlaceholder': 'Twoje imię',
                'form.email': 'Email',
                'form.emailPlaceholder': 'twoj@email.com',
                'form.phone': 'Telefon (opcjonalnie)',
                'form.phonePlaceholder': '+48...',
                'form.message': 'Wiadomość (opcjonalnie)',
                'form.messagePlaceholder': 'Pytania lub uwagi dotyczące tego dzieła...',
                'form.consent': 'Wyrażam zgodę na przetwarzanie moich danych osobowych w celu odpowiedzi na zapytanie o rezerwację.',
                'form.consentLink': 'Polityka prywatności',
                'form.submit': 'Wyślij zapytanie',
                'form.sending': 'Wysyłanie...',
                'form.successTitle': 'Zapytanie wysłane!',
                'form.successText': 'Dziękuję. Przejrzę Twoje zapytanie i odpowiem mailem.',
                'form.errorTitle': 'Coś poszło nie tak',
                'form.errorText': 'Spróbuj ponownie lub skontaktuj się bezpośrednio pod adresem',
                'form.required': 'To pole jest wymagane',
                'form.invalidEmail': 'Proszę podać prawidłowy adres email',
                'form.consentRequired': 'Proszę zaakceptować politykę prywatności'
            }
        };

        let currentLang = 'en';

        function t(key) {
            return (translations[currentLang] && translations[currentLang][key]) || translations.en[key] || key;
        }

        // ── XSS protection ──
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ── Language detection ──
        function initLanguage() {
            const saved = localStorage.getItem('lang');
            if (saved && translations[saved]) {
                currentLang = saved;
            } else {
                const browserLang = (navigator.language || '').toLowerCase();
                if (browserLang.startsWith('pl')) {
                    currentLang = 'pl';
                }
            }
            updateLangToggle();
        }

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            updateLangToggle();
            renderArtwork();
        }

        function updateLangToggle() {
            document.querySelectorAll('.lang-option').forEach(opt => {
                opt.classList.toggle('active', opt.dataset.lang === currentLang);
            });
        }

        // ── Email obfuscation ──
        function getEmail() {
            const parts = ['dagmaraokla', '.', 'art', '@', 'gmail', '.', 'com'];
            return parts.join('');
        }

        // ── State ──
        let artwork = null;
        let allArtworks = [];

        // ── Load artworks ──
        async function loadArtworks() {
            try {
                const response = await fetch('Data/artworks.json');
                if (!response.ok) throw new Error('Fetch failed');
                allArtworks = await response.json();
            } catch (err) {
                allArtworks = [];
            }

            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            const id = params.get('id');

            if (slug) {
                artwork = allArtworks.find(a => a.slug === slug);
            } else if (id) {
                artwork = allArtworks.find(a => a.id === id);
            }

            renderArtwork();
        }

        // ── Render ──
        function renderArtwork() {
            const page = document.getElementById('artwork-page');

            if (!artwork) {
                page.innerHTML = `
                    <div class="page-state">
                        <h1>${t('page.notFoundTitle')}</h1>
                        <p>${t('page.notFoundText')}</p>
                        <a href="index.html#catalog">${t('page.backLink')}</a>
                    </div>`;
                document.title = `${t('page.notFoundTitle')} — Dagmara Dreams of Nihonga`;
                return;
            }

            const art = artwork;
            document.title = `${art.title} — Dagmara Dreams of Nihonga`;

            const statusKey = (art.status || 'available').toLowerCase();
            const statusLabels = {
                available: t('artwork.statusAvailable'),
                reserved: t('artwork.statusReserved'),
                sold: t('artwork.statusSold')
            };

            const description = currentLang === 'pl' ? (art.descriptionPl || art.descriptionEn || '') : (art.descriptionEn || '');

            const priceText = (!art.priceDisplay || art.priceDisplay.trim() === '')
                ? t('artwork.priceOnRequest')
                : art.priceDisplay;

            let paperText = art.paper || '';
            if (paperText.startsWith('Japanese paper ')) {
                const paperName = paperText.replace('Japanese paper ', '');
                paperText = currentLang === 'pl' ? `Papier japoński ${paperName}` : `Japanese paper ${paperName}`;
            }

            // Escape all user data for XSS protection
            const safeArtTitle = escapeHtml(art.title);
            const safeArtSeries = escapeHtml(art.series);
            const safeArtFilename = escapeHtml(art.filename);
            const safeDescription = escapeHtml(description);
            const safePriceText = escapeHtml(priceText);
            const safePaperText = escapeHtml(paperText);
            const safeDimensions = escapeHtml(art.dimensions);
            const safeYear = escapeHtml(art.year);
            const safeStatusLabel = escapeHtml(statusLabels[statusKey] || statusLabels.available);

            let detailsHtml = `
                <span class="detail-label">${escapeHtml(t('artwork.dimensions'))}</span>
                <span class="detail-value">${safeDimensions}</span>`;

            if (paperText) {
                detailsHtml += `
                <span class="detail-label">${escapeHtml(t('artwork.paper'))}</span>
                <span class="detail-value">${safePaperText}</span>`;
            }

            if (art.year) {
                detailsHtml += `
                <span class="detail-label">${escapeHtml(t('artwork.year'))}</span>
                <span class="detail-value">${safeYear}</span>`;
            }

            // Reservation section
            let reservationHtml = '';

            if (statusKey === 'sold') {
                reservationHtml = `
                    <div class="reservation-sold">
                        <p>${t('reservation.soldTitle')}</p>
                        <small>${t('reservation.soldText')}</small>
                    </div>`;
            } else {
                const notice = statusKey === 'reserved'
                    ? t('reservation.reservedNotice')
                    : t('reservation.notice');

                const safeTitle = escapeHtml(art.title);
                const safeSlug = escapeHtml(art.slug || '');

                const formHtml = `
                  <form class="reservation-form" id="reservation-form" novalidate>
                    <input type="hidden" name="artworkTitle" value="${safeTitle}">
                    <input type="hidden" name="artworkSlug" value="${safeSlug}">
                    <input type="hidden" name="language" value="${currentLang}">
                    <input type="hidden" name="_timestamp" value="">

                    <div class="form-field">
                      <label for="rf-name">${escapeHtml(t('form.name'))} <span class="required-mark">*</span></label>
                      <input type="text" id="rf-name" name="name" required
                             placeholder="${escapeHtml(t('form.namePlaceholder'))}" autocomplete="name"
                             aria-describedby="rf-name-error">
                      <span class="form-error-msg" id="rf-name-error" role="alert">${escapeHtml(t('form.required'))}</span>
                    </div>

                    <div class="form-field">
                      <label for="rf-email">${escapeHtml(t('form.email'))} <span class="required-mark">*</span></label>
                      <input type="email" id="rf-email" name="email" required
                             placeholder="${escapeHtml(t('form.emailPlaceholder'))}" autocomplete="email"
                             aria-describedby="rf-email-error">
                      <span class="form-error-msg" id="rf-email-error" role="alert">${escapeHtml(t('form.invalidEmail'))}</span>
                    </div>

                    <div class="form-field">
                      <label for="rf-phone">${escapeHtml(t('form.phone'))}</label>
                      <input type="tel" id="rf-phone" name="phone"
                             placeholder="${escapeHtml(t('form.phonePlaceholder'))}" autocomplete="tel">
                    </div>

                    <div class="form-field">
                      <label for="rf-message">${escapeHtml(t('form.message'))}</label>
                      <textarea id="rf-message" name="message" rows="3"
                                placeholder="${escapeHtml(t('form.messagePlaceholder'))}"></textarea>
                    </div>

                    <!-- Honeypot - hidden from users and assistive tech -->
                    <div class="form-hp" aria-hidden="true" inert>
                      <label for="rf-website">Website</label>
                      <input type="text" id="rf-website" name="website" autocomplete="off">
                    </div>

                    <div class="form-consent" id="form-consent-wrapper">
                      <input type="checkbox" id="rf-consent" name="consent" required
                             aria-describedby="rf-consent-error">
                      <label for="rf-consent">
                        ${escapeHtml(t('form.consent'))}
                        <a href="privacy.html">${escapeHtml(t('form.consentLink'))}</a>
                      </label>
                      <span class="form-error-msg" id="rf-consent-error" role="alert" style="display:none;">${escapeHtml(t('form.consentRequired'))}</span>
                    </div>

                    <button type="submit" class="form-submit-btn" id="form-submit-btn">${escapeHtml(t('form.submit'))}</button>

                    <div class="form-status" id="form-status" role="status" aria-live="polite"></div>
                  </form>`;

                trackEventOnce('reservation_form_loaded', {
                    'artwork_title': art.title,
                    'artwork_slug': art.slug || '',
                    'artwork_status': statusKey,
                    'language': currentLang
                });

                reservationHtml = `
                    <p class="reservation-notice">${notice}</p>
                    ${formHtml}
                    <div class="privacy-note">
                        ${escapeHtml(t('privacy.note'))} <a href="privacy.html">${escapeHtml(t('privacy.linkText'))}</a>.
                    </div>
                    <div class="fallback-contact">
                        ${escapeHtml(t('fallback.text'))} <a href="mailto:${getEmail()}">${escapeHtml(t('fallback.linkText'))}</a>
                    </div>`;
            }

            page.innerHTML = `
                <!-- Artwork header -->
                <div class="artwork-header">
                    ${safeArtSeries ? `<div class="artwork-series">${safeArtSeries}</div>` : ''}
                    <h1 class="artwork-title">${safeArtTitle}</h1>
                    <span class="status-badge ${statusKey}">${safeStatusLabel}</span>
                </div>

                <!-- Image -->
                <div class="artwork-image-wrapper" id="artwork-image-trigger" role="button" tabindex="0" aria-label="${currentLang === 'pl' ? 'Kliknij aby powiększyć' : 'Click to enlarge'}">
                    <img src="Data/Lightbox_new/Preview/${safeArtFilename}.webp"
                         alt="${safeArtTitle} — Nihonga painting"
                         id="artwork-main-image"
                         data-fullsrc="Data/Lightbox_new/Original/${safeArtFilename}.webp">
                </div>
                <div class="image-hint">${escapeHtml(t('artwork.tapToEnlarge'))}</div>

                <!-- Price -->
                <div class="artwork-price">
                    ${safePriceText}
                    ${(!art.priceDisplay || art.priceDisplay.trim() === '') ? '' : `<span class="artwork-price-note">${currentLang === 'pl' ? 'Cena zawiera certyfikat autentyczności' : 'Price includes certificate of authenticity'}</span>`}
                </div>

                <!-- Details -->
                <div class="artwork-details">
                    ${detailsHtml}
                </div>

                <!-- Description -->
                ${safeDescription ? `<p class="artwork-description">${safeDescription}</p>` : ''}

                <hr class="section-divider">

                <!-- Reservation -->
                <div class="reservation-section">
                    <h2 class="reservation-title">${escapeHtml(t('reservation.title'))}</h2>
                    ${reservationHtml}
                </div>
            `;

            // Re-attach listeners
            setupLightbox();
            setupReservationForm();
            updateFooterText();

            trackEventOnce('artwork_view', {
                'artwork_title': art.title,
                'artwork_slug': art.slug || '',
                'artwork_status': statusKey,
                'artwork_series': art.series || '',
                'language': currentLang,
                'referrer': document.referrer
            });
        }

        // ── Reservation Form ──
        function setupReservationForm() {
            const form = document.getElementById('reservation-form');
            if (!form) return;

            // Set timestamp for spam check
            form.querySelector('[name="_timestamp"]').value = Date.now();

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                // Prevent double-submit
                const submitBtn = document.getElementById('form-submit-btn');
                if (submitBtn.disabled) return;
                submitBtn.disabled = true;

                // Clear previous errors
                form.querySelectorAll('.form-field-error').forEach(el => el.classList.remove('form-field-error'));
                form.querySelectorAll('[aria-invalid]').forEach(el => el.removeAttribute('aria-invalid'));
                const consentWrapper = document.getElementById('form-consent-wrapper');
                if (consentWrapper) consentWrapper.classList.remove('form-consent-error');
                const consentError = document.getElementById('rf-consent-error');
                if (consentError) consentError.style.display = 'none';

                // Validate
                const nameField = form.querySelector('[name="name"]');
                const emailField = form.querySelector('[name="email"]');
                const consentField = form.querySelector('[name="consent"]');
                let valid = true;

                if (!nameField.value.trim()) {
                    nameField.closest('.form-field').classList.add('form-field-error');
                    nameField.setAttribute('aria-invalid', 'true');
                    valid = false;
                }
                if (!emailField.value.trim() || !/^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$/.test(emailField.value)) {
                    emailField.closest('.form-field').classList.add('form-field-error');
                    emailField.setAttribute('aria-invalid', 'true');
                    valid = false;
                }
                if (!consentField.checked) {
                    if (consentWrapper) consentWrapper.classList.add('form-consent-error');
                    consentField.setAttribute('aria-invalid', 'true');
                    if (consentError) consentError.style.display = 'block';
                    consentField.focus();
                    valid = false;
                }

                if (!valid) {
                    const failedFields = [
                        !nameField.value.trim() ? 'name' : '',
                        (!emailField.value.trim() || !/^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$/.test(emailField.value)) ? 'email' : '',
                        !consentField.checked ? 'consent' : ''
                    ].filter(Boolean).join(',');
                    trackEvent('form_validation_failure', {
                        artwork_title: artwork.title,
                        artwork_slug: artwork.slug || '',
                        failed_fields: failedFields,
                        language: currentLang
                    });
                    submitBtn.disabled = false;
                    return;
                }

                // Honeypot check
                if (form.querySelector('[name="website"]').value) return;

                const statusEl = document.getElementById('form-status');

                // Show loading
                submitBtn.textContent = t('form.sending');
                statusEl.className = 'form-status loading';
                statusEl.textContent = t('form.sending');

                trackEvent('form_submit_attempt', {
                    artwork_title: artwork.title,
                    artwork_slug: artwork.slug || '',
                    language: currentLang
                });

                const payload = {
                    name: nameField.value.trim(),
                    email: emailField.value.trim(),
                    phone: form.querySelector('[name="phone"]').value.trim(),
                    message: form.querySelector('[name="message"]').value.trim(),
                    artworkTitle: form.querySelector('[name="artworkTitle"]').value,
                    artworkSlug: form.querySelector('[name="artworkSlug"]').value,
                    language: currentLang,
                    _timestamp: form.querySelector('[name="_timestamp"]').value,
                    consent: consentField.checked,
                    consentTimestamp: new Date().toISOString()
                };

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 15000);

                    const resp = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload),
                        signal: controller.signal
                    });

                    clearTimeout(timeoutId);

                    let result;
                    try {
                        result = await resp.json();
                    } catch (_) {
                        result = null;
                    }

                    if (result && result.status === 'success') {
                        statusEl.className = 'form-status success';
                        statusEl.textContent = '';
                        const successTitle = document.createElement('strong');
                        successTitle.textContent = t('form.successTitle');
                        statusEl.appendChild(successTitle);
                        statusEl.appendChild(document.createElement('br'));
                        statusEl.appendChild(document.createTextNode(t('form.successText')));
                        Array.from(form.children).forEach(child => {
                            if (child.id !== 'form-status') child.style.display = 'none';
                        });
                        trackEvent('form_submit_success', {
                            artwork_title: artwork.title,
                            artwork_slug: artwork.slug || '',
                            language: currentLang
                        });
                    } else if (resp.ok) {
                        // Response was 2xx but unexpected shape — data likely written
                        statusEl.className = 'form-status success';
                        statusEl.textContent = '';
                        const successTitle = document.createElement('strong');
                        successTitle.textContent = t('form.successTitle');
                        statusEl.appendChild(successTitle);
                        statusEl.appendChild(document.createElement('br'));
                        statusEl.appendChild(document.createTextNode(t('form.successText')));
                        Array.from(form.children).forEach(child => {
                            if (child.id !== 'form-status') child.style.display = 'none';
                        });
                        trackEvent('form_submit_success', {
                            artwork_title: artwork.title,
                            artwork_slug: artwork.slug || '',
                            language: currentLang
                        });
                    } else {
                        const serverMsg = (result && result.message) ? 'server_error' : 'non_ok_response';
                        throw new Error(serverMsg);
                    }
                } catch (err) {
                    statusEl.className = 'form-status error';
                    statusEl.textContent = '';
                    const errorTitle = document.createElement('strong');
                    errorTitle.textContent = t('form.errorTitle');
                    statusEl.appendChild(errorTitle);
                    statusEl.appendChild(document.createElement('br'));
                    statusEl.appendChild(document.createTextNode(t('form.errorText') + ' '));
                    const emailLink = document.createElement('a');
                    emailLink.href = 'mailto:' + getEmail();
                    emailLink.textContent = getEmail();
                    statusEl.appendChild(emailLink);
                    submitBtn.disabled = false;
                    submitBtn.textContent = t('form.submit');
                    const errorCategory = err.name === 'AbortError' ? 'timeout'
                        : err.message === 'server_error' || err.message === 'non_ok_response'
                        ? err.message
                        : err.name === 'TypeError' ? 'network_error' : 'unknown';
                    trackEvent('form_submit_error', {
                        artwork_title: artwork.title,
                        error: errorCategory,
                        language: currentLang
                    });
                }
            });
        }

        // ── Analytics ──
        const _firedOnce = {};
        function trackEvent(eventName, params = {}) {
            if (typeof gtag === 'function') {
                gtag('event', eventName, params);
            }
        }
        function trackEventOnce(eventName, params = {}) {
            if (_firedOnce[eventName]) return;
            _firedOnce[eventName] = true;
            trackEvent(eventName, params);
        }

        // ── Lightbox ──
        let lightboxAC = null;

        function setupLightbox() {
            if (lightboxAC) lightboxAC.abort();
            lightboxAC = new AbortController();
            const sig = { signal: lightboxAC.signal };

            const trigger = document.getElementById('artwork-image-trigger');
            const lightbox = document.getElementById('artwork-lightbox');
            const lightboxImg = document.getElementById('lightbox-full-image');
            const closeBtn = lightbox.querySelector('.artwork-lightbox-close');

            if (!trigger) return;

            function openLightbox() {
                const mainImg = document.getElementById('artwork-main-image');
                const fullSrc = mainImg.dataset.fullsrc || mainImg.src;
                lightboxImg.src = fullSrc;
                lightboxImg.alt = mainImg.alt;
                lightbox.classList.add('active');
                lightbox.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
                closeBtn.focus();
                if (artwork) {
                    trackEvent('artwork_image_enlarge', {
                        'artwork_title': artwork.title,
                        'artwork_slug': artwork.slug || ''
                    });
                }
            }

            function closeLightbox() {
                lightbox.classList.remove('active');
                lightbox.setAttribute('aria-hidden', 'true');
                document.body.style.overflow = '';
                trigger.focus();
            }

            trigger.addEventListener('click', openLightbox, sig);
            trigger.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    openLightbox();
                }
            }, sig);

            closeBtn.addEventListener('click', closeLightbox, sig);
            lightbox.addEventListener('click', e => {
                if (e.target === lightbox) closeLightbox();
            }, sig);

            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                    closeLightbox();
                }
            }, sig);
        }

        // ── Footer & nav text update ──
        function updateFooterText() {
            const link = document.getElementById('footer-privacy-link');
            if (link) link.textContent = t('footer.privacy');

            const backNav = document.getElementById('back-link');
            if (backNav) backNav.textContent = currentLang === 'pl' ? '← Powrót do galerii' : '← Back to gallery';
        }

        // ── Image protection ──
        document.addEventListener('contextmenu', e => {
            if (e.target.tagName === 'IMG' ||
                e.target.closest('.artwork-image-wrapper') ||
                e.target.closest('.artwork-lightbox')) {
                e.preventDefault();
            }
        });

        document.addEventListener('dragstart', e => {
            if (e.target.tagName === 'IMG') e.preventDefault();
        });

        // ── Language toggle ──
        document.getElementById('lang-toggle').addEventListener('click', () => {
            const newLang = currentLang === 'en' ? 'pl' : 'en';
            trackEvent('language_switch', {
                'from_language': currentLang,
                'to_language': newLang,
                'page': 'artwork',
                'artwork_title': artwork ? artwork.title : ''
            });
            setLanguage(newLang);
        });

        // ── Init ──
        initLanguage();
        loadArtworks();
    </script>
